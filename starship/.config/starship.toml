"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
palette = "catppuccin_mocha"
format = """
[](peach)\
$directory\
($aws$kubernetes)\
$line_break\
$character"""

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[aws]
symbol = "AWS "
format = "[](yellow)[ $symbol$profile ]($style)[](fg:yellow)"
style = "bg:yellow fg:crust"

[kubernetes]
disabled = false
format = "[](teal)[ K8s $context( / $namespace) ]($style)[](fg:teal)"
style = "bg:teal fg:crust"

[character]
success_symbol = "[❯](bold mauve)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold teal)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
