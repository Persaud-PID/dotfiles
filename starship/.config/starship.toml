"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
palette = "tokyonight_night"
format = """
[](blue)\
$directory\
($aws$kubernetes)\
$line_break\
$character"""

[directory]
style = "bg:blue fg:background"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[aws]
symbol = "AWS "
format = "[](yellow)[ $symbol$profile ]($style)[](fg:yellow)"
style = "bg:yellow fg:background"

[kubernetes]
disabled = false
format = "[](cyan)[ K8s $context( / $namespace) ]($style)[](fg:cyan)"
style = "bg:cyan fg:background"

[character]
success_symbol = "[❯](bold magenta)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold cyan)"

[palettes.tokyonight_night]
background = "#1a1b26"
foreground = "#c0caf5"
blue = "#7aa2f7"
cyan = "#7dcfff"
green = "#9ece6a"
magenta = "#bb9af7"
red = "#f7768e"
yellow = "#e0af68"
